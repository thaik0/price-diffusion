# Baseline values are placeholders, not finalized empirical design choices.
universe:
  name: semiconductor_equities
  currency: USD
  # Thresholds are baseline design choices and must be sensitivity-tested.
  min_history_days: 60
  min_price: 5.0
  min_average_dollar_volume: 1000000.0
  average_dollar_volume_window_days: 20
  us_exchanges:
    - NASDAQ
    - NYSE
    - NYSE American
  eligible_security_types:
    - common_stock
    - adr
  # The bundled classifications are a current review snapshot. Historical use
  # is fail-closed unless a researcher deliberately changes the override below.
  classification_as_of_date: "2026-08-22"
  allow_classification_before_as_of: false

date_range:
  start: "2015-01-01"
  end: "2025-12-31"

event_thresholds:
  # Stage 7 event definition. Values are pre-analysis design choices.
  minimum_relative_move: 0.05
  volatility_window: 60
  threshold_multiplier: 3.0
  cooldown_period: 5
  cooldown_scope: both
  minimum_peer_count: 3
  minimum_history_requirement: 60
  exclude_corporate_action_types:
    - split
    - merger
    - abnormal_price_adjustment
    - unknown

event_study:
  # Outcomes start at t+1; day 0 is retained only in the event-time panel.
  primary_horizons:
    - 1
    - 5
  descriptive_horizons:
    - 3
    - 10
  event_window:
    pre_event_days: 5
    post_event_days: 10
  return_specification: semiconductor_adjusted_return

peer_definition:
  method: industry_group
  minimum_peers: 3
  maximum_peers: 10

random_seed: 42

output_paths:
  root: outputs
  figures: outputs/figures
  tables: outputs/tables
  diagnostics: outputs/diagnostics
